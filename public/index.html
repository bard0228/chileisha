<script>
/**
 * Android 12 Edge Overscroll Stretch Engine
 * 當容器滾動到頂部繼續下拉，或到底部繼續上推時，觸發邊緣物理拉伸 (scaleY) 並在放手後彈性回彈。
 * 建議將 targetEl 指向主內容容器（如 #app-shell）；歸位後自動清除 transform 以免影響 fixed/sticky 定位。
 */
function attachAndroidEdgeStretch(
  scrollEl = document.scrollingElement || document.documentElement,
  targetEl = document.querySelector('#app-shell, main') || document.body
) {
  let startY = 0;
  let stretch = 0;
  let activeEdge = null; // 'top' | 'bottom' | null

  const applyStretch = (val, edge) => {
    if (!edge || val <= 0.001) {
      targetEl.style.transition = 'transform 0.36s cubic-bezier(0.22, 1, 0.36, 1)';
      targetEl.style.transform = 'scaleY(1)';
      const onEnd = (ev) => {
        if (ev.propertyName === 'transform' && !activeEdge) {
          targetEl.style.transform = '';
          targetEl.style.transition = '';
          targetEl.style.transformOrigin = '';
          targetEl.removeEventListener('transitionend', onEnd);
        }
      };
      targetEl.addEventListener('transitionend', onEnd);
      // Safety fallback in case synthetic or zero-delta release skips transitionend
      setTimeout(() => {
        if (!activeEdge && targetEl.style.transform === 'scaleY(1)') {
          targetEl.style.transform = '';
          targetEl.style.transition = '';
          targetEl.style.transformOrigin = '';
          targetEl.removeEventListener('transitionend', onEnd);
        }
      }, 420);
      return;
    }
    targetEl.style.transition = 'none';
    targetEl.style.transformOrigin = edge === 'top' ? 'top center' : 'bottom center';
    const scale = 1 + Math.min(0.055, val * 0.00028);
    targetEl.style.transform = `scaleY(${scale.toFixed(4)})`;
  };

  window.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    stretch = 0;
    activeEdge = null;
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    const atTop = scrollEl.scrollTop <= 1;
    const atBottom = scrollEl.scrollTop + window.innerHeight >= scrollEl.scrollHeight - 2;

    if (atTop && dy > 0) {
      activeEdge = 'top';
      stretch = Math.sqrt(dy) * 14;
      applyStretch(stretch, 'top');
    } else if (atBottom && dy < 0) {
      activeEdge = 'bottom';
      stretch = Math.sqrt(-dy) * 14;
      applyStretch(stretch, 'bottom');
    } else if (activeEdge) {
      activeEdge = null;
      applyStretch(0, null);
    }
  }, { passive: true });

  const release = () => {
    if (activeEdge || stretch > 0) {
      activeEdge = null;
      stretch = 0;
      applyStretch(0, null);
    }
  };
  window.addEventListener('touchend', release, { passive: true });
  window.addEventListener('touchcancel', release, { passive: true });
}

    attachAndroidEdgeStretch(
      document.scrollingElement || document.documentElement,
      document.getElementById('app-shell')
    );
  </script>

    let deferredPrompt = null;

      inset 0 1.5px 1px rgba(255, 255, 255, 0.94),
      0 10px 26px -6px rgba(45, 58, 76, 0.16);
    color: var(--ink-1, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    outline: none;
  }
  .liquid-glass-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .liquid-glass-btn:active svg.refresh-icon {
    transform: rotate(180deg);
  }
  .bottom-left-dock .liquid-glass-btn {
    font: inherit;
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    box-sizing: border-box;
  }
  .bottom-left-dock .liquid-glass-btn svg {
    display: block;
    max-width: none;
  }
  .bottom-left-dock.sushi-portal-dock--embedded {
    display: none !important;
  }
  </style>
  <div class="bottom-left-dock">
    <button id="liquid-back-btn" class="liquid-glass-btn hover-lift" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <button id="liquid-refresh-btn" class="liquid-glass-btn hover-lift" type="button" aria-label="重新整理">
      <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <polyline points="21 3 21 9 15 9" />
      </svg>
    </button>
  </div>

  <script>
  (function () {
    var PORTAL = 'https://sushi-portal-bard.web.app/';
    var dock = document.querySelector('.bottom-left-dock');
    if (!dock) return;
    var embedded = false;
    try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
    if (embedded) {
      dock.classList.add('sushi-portal-dock--embedded');
      return;
    }
    var back = document.getElementById('liquid-back-btn');
    var refresh = document.getElementById('liquid-refresh-btn');
    if (back) back.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (window.history.length > 1) window.history.back();
      else window.location.href = PORTAL;
    });
    if (refresh) refresh.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      window.location.reload();
    });
  })();
  </script>
  <!-- sushi-portal-dock-end -->
</body>
</html>
